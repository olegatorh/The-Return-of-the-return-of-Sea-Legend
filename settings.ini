; Port settings. BetaTestMode: Off | Test | On  (Test/On show the extra beta page of the options screen: cheats, debug logs, locator display ...)
[game]
BetaTestMode = On
; CombatSpeed: speed of blows, blocks, shots and hit reactions (1 = the original animation speed, lower = slower fight; default 0.7)
CombatSpeed = 0.7
; WaveScale: height of the sea swell (the script values are used at half size; 1 = that, default 1.35, bigger = taller waves)
WaveScale = 1.35
; WaterShader: boujie (default, sea after the Boujie Water Shader: foam, shore foam, depth fog, refraction) | classic (the earlier own sea shader)
WaterShader = boujie
; SeaClockStep: real seconds per game minute at sea (default 8: an hour in 8 minutes; on land 2.5). The weather record is re-picked at sea rarely: not in a fight, at most every
; WeatherRepickHours game hours and WeatherRepickSeconds real seconds, then sky / fog / sun / rain / waves glide to it over WeatherBlendSeconds
SeaClockStep = 8
WeatherBlendSeconds = 90
WeatherRepickHours = 3.5
WeatherRepickSeconds = 240

; window: Fullscreen = 1 for full screen, WindowWidth / WindowHeight (F11 toggles full screen in the game)
[video]
Fullscreen = 0
WindowWidth = 1600
WindowHeight = 900
